name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *' # Проверять обновления каждый час
  workflow_dispatch: # Позволяет запустить вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream
        uses: ahmadnassri/action-workflow-run-wait@v1 # Опционально
      - uses: actions/checkout@v3
      - name: Sync
        run: |
          git remote add upstream  https://github.com/Ra1ymkulov/JashtarFrontend.git 
          
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
